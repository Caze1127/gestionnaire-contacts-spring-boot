<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <link
            rel="stylesheet"
            href="/styles/style.css"
    >

    <title>Nouveau mot de passe</title>

</head>

<body>


<main class="auth-shell">

    <section class="auth-card">

        <p class="home-label">
            SÉCURITÉ
        </p>

        <h1>
            Nouveau mot de passe
        </h1>

        <p class="auth-description">
            Choisissez un nouveau mot de passe pour votre compte.
        </p>

        <form
                id="reset-password-form"
                class="account-form"
        >

            <label for="new-reset-password">
                Nouveau mot de passe
            </label>

            <input
                    id="new-reset-password"
                    type="password"
                    minlength="8"
                    required
            >

            <label for="confirm-reset-password">
                Confirmation
            </label>

            <input
                    id="confirm-reset-password"
                    type="password"
                    minlength="8"
                    required
            >

            <button
                    type="submit"
                    class="add-button"
            >
                Réinitialiser
            </button>

        </form>

        <p id="reset-message"></p>

        <a
                class="auth-back-link"
                href="/login.html"
        >
            ← Retour à la connexion
        </a>

    </section>

</main>

<script
        src="/scripts/theme.js"
        defer
></script>

<script
        src="/scripts/reset-password.js"
        defer
></script>

</body>

</html>
