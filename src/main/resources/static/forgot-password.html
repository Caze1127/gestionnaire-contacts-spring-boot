<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <link
            rel="stylesheet"
            href="/styles/style.css"
    >

    <title>Mot de passe oublié</title>

</head>

<body>

<main class="auth-shell">

    <section class="auth-card">

        <p class="home-label">
            SÉCURITÉ
        </p>

        <h1>
            Mot de passe oublié
        </h1>

        <p class="auth-description">
            Saisissez l'adresse e-mail associée à votre compte.
        </p>

        <form
                id="forgot-password-form"
                class="account-form"
        >

            <label for="forgot-email">
                Adresse e-mail
            </label>

            <input
                    id="forgot-email"
                    type="email"
                    required
            >

            <button
                    type="submit"
                    class="add-button"
            >
                Générer le lien
            </button>

        </form>

        <p id="forgot-message"></p>


        <a
                class="auth-back-link"
                href="/login.html"
        >
            ← Retour à la connexion
        </a>

    </section>

</main>

<script
        src="/scripts/theme.js"
        defer
></script>

<script
        src="/scripts/forgot-password.js"
        defer
></script>

</body>

</html>
