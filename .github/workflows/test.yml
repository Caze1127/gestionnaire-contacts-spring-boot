
name: Tests Java Spring Boot

on: [push, pull_request]

jobs:
  test:
    name: Build et tests
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurer Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Autoriser Gradle
        run: chmod +x gradlew

      - name: Compiler et tester
        run: ./gradlew clean test --no-daemon

      - name: Afficher les erreurs detaillees
        if: failure()
        run: |
          for f in build/test-results/test/TEST-*.xml; do
            [ -f "$f" ] || continue
            echo "=== $f ==="
            sed -n '/<failure/,/<\/failure>/p' "$f" | head -n 70
          done
